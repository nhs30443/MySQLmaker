<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MySQLmaker</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/parts/_flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>



<body>
    {% include 'parts/_flash.html' %}

    <div class="app">
        <header>
            <div class="logo">MySQLmaker</div>

            <div class="header-buttons">
                <button id="settings-btn" class="settings-btn">
                    設定
                </button>
                <button id="create-db-btn" class="create-db-btn">
                    データベース作成
                </button>
                <div class="toggle-switch">
                    <div class="toggle-option active">DB</div>
                    <div class="toggle-option">ログ</div>
                </div>
            </div>
        </header>

        <aside class="sidebar"></aside>

        <main class="main">
            <div id="db-view" class="main-view active">
                <div id="table1" class="table-card" data-role="table">
                    <div id="table1-logical" class="table-logical" data-role="table-logical">
                        <input type="text" class="input-table" placeholder="テーブル論理名" />
                    </div>
                    <div id="table1-physical" class="table-physical" data-role="table-physical">
                        <input type="text" class="input-table" placeholder="table_physical_name" />
                    </div>

                    <div id="table1-column-wrapper" class="column-wrapper" data-role="column-wrapper">
                        <div id="table1-column1-row" class="column-row" data-role="column-row">
                            <div id="table1-column1-logical" class="col-logical" data-role="column-logical">
                                <input type="text" class="input-col" placeholder="カラム論理名" />
                            </div>
                            <div id="table1-column1-key" class="col-key" data-role="column-key">
                                <input type="text" class="input-col" placeholder="PK/FK" />
                            </div>
                            <div id="table1-column1-physical" class="col-physical" data-role="column-physical">
                                <input type="text" class="input-col" placeholder="column_physical_name" />
                            </div>
                            <div id="table1-column1-mold" class="col-mold" data-role="column-mold">
                                <input type="text" class="input-col" placeholder="型" />
                            </div>
                            <div id="table1-column1-default" class="col-default" data-role="column-default">
                                <input type="text" class="input-col" placeholder="デフォルト値" />
                            </div>
                            <div class="col-ng1" style="display: none"></div>
                            <div id="table1-column1-not-null" class="col-constraint" data-role="column-not-null">
                                <label>
                                    <input type="checkbox" class="chk-col" /> NOT NULL
                                </label>
                            </div>
                            <div id="table1-column1-auto-increment" class="col-constraint"
                                data-role="column-auto-increment" style="display: none">
                                <label class="auto-increment">
                                    <input type="checkbox" class="chk-col" /> AUTO INCREMENT
                                </label>
                            </div>
                            <div class="col-reference" style="display: none" data-role="column-reference">
                                <input type="text" class="input-col" placeholder="FK参照先" />
                            </div>
                            <div class="col-ng2"></div>
                            <div id="table1-column1-unique" class="col-constraint" data-role="column-unique">
                                <label>
                                    <input type="checkbox" class="chk-col" /> UNIQUE
                                </label>
                            </div>
                            <div class="col-on-delete" style="display: none" data-role="column-on-delete">
                                <input type="text" class="input-col" placeholder="ON DELETE" />
                            </div>
                            <div class="col-on-update" style="display: none" data-role="column-on-update">
                                <input type="text" class="input-col" placeholder="ON UPDATE" />
                            </div>
                        </div>
                    </div>

                    <div class="add-column" data-role="add-column">＋ カラムを追加</div>
                </div>

                <div class="add-table-btn" data-role="add-table">＋ 新しいテーブル</div>
            </div>

            <div id="log-view" class="main-view"></div>
        </main>

        <div id="settings-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">設定</h2>
                    <span id="close-modal" class="close">&times;</span>
                </div>

                <form id="config-form">
                    <div class="form-group">
                        <label>DeepL API Key</label>
                        <input type="text" name="DEEPL_API_KEY" value="{{ DEEPL_API_KEY }}" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>DB User</label>
                        <input type="text" name="DB_USER" value="{{ DB_USER }}" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>DB Password</label>
                        <input type="text" name="DB_PASSWORD" value="{{ DB_PASSWORD }}" autocomplete="off">
                    </div>
                    <button type="submit" id="btn-save" class="btn-save">保存</button>
                </form>
            </div>
        </div>

        <div id="create-db-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">データベース作成</h2>
                    <span id="close-create-db-modal" class="close">&times;</span>
                </div>

                <div class="modal-sub-actions">
                    <button type="button" id="save-json-btn" class="btn-secondary">
                        JSONを保存
                    </button>

                    <button type="button" id="save-sql-btn" class="btn-secondary">
                        SQLを保存
                    </button>
                </div>

                <hr class="modal-divider">

                <form id="create-db-form">
                    <div class="form-group">
                        <label for="db-name-input">データベース名</label>
                        <input type="text" id="db-name-input" name="db_name" placeholder="database_name"
                            autocomplete="off">
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancel-create-db" class="btn-cancel">
                            キャンセル
                        </button>

                        <button type="submit" id="confirm-create-db" class="btn-primary">
                            DBを作成
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/parts/_flash.js') }}"></script>
    <script src="{{ url_for('static', filename='js/parts/_modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toggle.js') }}"></script>
    <script src="{{ url_for('static', filename='js/add-table.js') }}"></script>
    <script src="{{ url_for('static', filename='js/command.js') }}"></script>
    <script src="{{ url_for('static', filename='js/create-db.js') }}"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/log.js') }}"></script>

</body>

</html>
